x-api: &api
  build: ./server
  image: devsync-api
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    PORT: 5000
    DATABASE_URL: postgres://devsync:devsync_local@db:5432/devsync
    JWT_SECRET: local-docker-only-not-a-real-secret
    CLIENT_ORIGIN: http://localhost:5173,http://localhost:5174
    REDIS_URL: redis://redis:6379
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    MAIL_FROM: DevSync <no-reply@devsync.local>
    APP_URL: http://localhost:5173

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devsync
      POSTGRES_PASSWORD: devsync_local
      POSTGRES_DB: devsync
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsync -d devsync"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" 
  
  api:
    <<: *api
    ports:
      - "5000:5000"

  api2:
    <<: *api
    ports:
      - "5001:5000"

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000
    image: devsync-web
    depends_on:
      - api
    ports:
      - "5173:80"

  web2:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5001
    image: devsync-web2
    depends_on:
      - api2
    ports:
      - "5174:80"

volumes:
  pgdata: