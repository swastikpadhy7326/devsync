services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devsync
      POSTGRES_PASSWORD: devsync_local
      POSTGRES_DB: devsync
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsync -d devsync"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgres://devsync:devsync_local@db:5432/devsync
      JWT_SECRET: local-docker-only-not-a-real-secret
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata: